version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
  - package-ecosystem: terraform
    directories: [/bootstrap, /envs/dev, /envs/staging, /envs/prod]
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
