# Pull requests: format, validate and IaC security scans (no cloud access).
# main: plan and apply each environment in order. Each job uses a GitHub environment
# (dev, staging, prod) whose OIDC role only that environment can assume; add required
# reviewers to staging and prod so every apply waits for approval. Deploys run only after
# the repository variable DEPLOY_ENABLED is set to true, once the client's AWS setup is done.
name: terraform

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  CHECKOV_IMAGE: bridgecrew/checkov:3.3.29@sha256:3cc125b5337717b7303dbddd4e79374c120687b5ff6a24f9abdad56b562469f3
  TRIVY_IMAGE: aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222
  TF_IN_AUTOMATION: "true"

jobs:
  checks:
    name: Format, validate and scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - name: Format
        run: terraform fmt -recursive -check -diff
      - name: Validate
        run: |
          for dir in bootstrap envs/dev envs/staging envs/prod gcp/bootstrap gcp/envs/dev gcp/envs/staging gcp/envs/prod; do
            terraform -chdir="$dir" init -backend=false -input=false >/dev/null
            terraform -chdir="$dir" validate
          done
      - name: Trivy (blocks on HIGH/CRITICAL)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src:ro" "$TRIVY_IMAGE" config /src --quiet \
            --skip-dirs '**/.terraform' --severity HIGH,CRITICAL --exit-code 1
      - name: Checkov (blocks on any failed check; skips need a written reason)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src:ro" "$CHECKOV_IMAGE" \
            -d /src --framework terraform --quiet --compact --skip-path .terraform

  deploy:
    name: Deploy ${{ matrix.environment }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      max-parallel: 1
      matrix:
        environment: [dev, staging, prod]
    environment: ${{ matrix.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Plan
        working-directory: envs/${{ matrix.environment }}
        env:
          TF_VAR_project: ${{ vars.PROJECT }}
          TF_VAR_github_repository: ${{ github.repository }}
          TF_VAR_deploy_policy_arns: ${{ vars.DEPLOY_POLICY_ARNS }}
          TF_VAR_enable_account_baseline: ${{ vars.ENABLE_ACCOUNT_BASELINE }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="kms_key_id=${{ vars.TF_STATE_KMS_KEY_ARN }}"
          terraform plan -input=false -out=tfplan
      - name: Apply
        working-directory: envs/${{ matrix.environment }}
        run: terraform apply -input=false tfplan
