# GCP deploys: plan and apply each environment in order after merges to main.
# Checks for pull requests run in terraform.yml. Each job uses a GitHub environment
# (dev, staging, prod) whose Workload Identity provider accepts only that environment;
# add required reviewers to staging and prod. Runs only once DEPLOY_ENABLED_GCP is true.
name: terraform-gcp

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-gcp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy GCP ${{ matrix.environment }}
    if: vars.DEPLOY_ENABLED_GCP == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      max-parallel: 1
      matrix:
        environment: [dev, staging, prod]
    environment: ${{ matrix.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Plan
        working-directory: gcp/envs/${{ matrix.environment }}
        env:
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_name: ${{ vars.PROJECT }}
          TF_VAR_github_repository: ${{ github.repository }}
          TF_VAR_deploy_project_roles: ${{ vars.GCP_DEPLOY_ROLES }}
        run: |
          terraform init -input=false -backend-config="bucket=${{ vars.GCP_TF_STATE_BUCKET }}"
          terraform plan -input=false -out=tfplan
      - name: Apply
        working-directory: gcp/envs/${{ matrix.environment }}
        run: terraform apply -input=false tfplan
